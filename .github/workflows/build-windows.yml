name: Build NOVA MEDIA PLAYER Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v5
      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Zainstaluj zaleznosci
        run: npm install --no-audit --no-fund
      - name: Sprawdz projekt
        run: npm run check
      - name: Zbuduj instalator i portable
        run: npm run build:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Opublikuj artefakty
        uses: actions/upload-artifact@v5
        with:
          name: NOVA-MEDIA-PLAYER-1.0-WINDOWS
          path: |
            dist/*.exe
          if-no-files-found: error
